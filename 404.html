<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting — Dazzle by Dua</title>
<script>
  (function() {
    var path = window.location.pathname;
    var lower = path.toLowerCase();
    var search = window.location.search || '';
    var hash = window.location.hash || '';

    // If the path contains admin (case-insensitive e.g. /Admin, /admin, /ADMIN)
    if (lower.indexOf('admin') !== -1) {
      window.location.replace('/Dazzle_frontend/admin/' + search + hash);
      return;
    }

    // Default redirect back to store
    window.location.replace('/Dazzle_frontend/' + search + hash);
  })();
</script>
</head>
<body style="background:#1A1A1A;color:#D4AF7C;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
  <div style="text-align:center">
    <h2 style="font-size:1.5rem;margin-bottom:0.5rem">Loading Dazzle by Dua...</h2>
    <p style="color:#FFF;font-size:0.9rem">Redirecting you to the requested page.</p>
  </div>
</body>
</html>
